name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root
          MYSQL_DATABASE: pt_academy_test
          MYSQL_USER: pt
          MYSQL_PASSWORD: pt_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      NODE_ENV: test
      DATABASE_URL: mysql://pt:pt_test@127.0.0.1:3306/pt_academy_test
      JWT_SECRET: ci-test-only-jwt-secret-minimum-32-characters
      ENCRYPTION_KEY: ci-test-only-encryption-key-minimum-32-characters
      APP_URL: http://localhost:5173
      DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --audit-level=high
